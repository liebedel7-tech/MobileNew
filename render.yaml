services:
  - type: web
    name: mobile-meter-reader
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: MOBILE_TERMINAL_URL
        value: https://meterreader.onrender.com
      - key: VITE_MOBILE_TERMINAL_URL
        value: https://meterreader.onrender.com
      - key: CENTRAL_API_URL
        value: https://twd-6pqd.onrender.com
      - key: VITE_CENTRAL_API_URL
        value: https://twd-6pqd.onrender.com
