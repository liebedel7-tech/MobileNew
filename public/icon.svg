<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="dropletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app icon frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />

  <!-- Outer Emblem Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#0284c7" stroke-width="6" stroke-dasharray="12 8" opacity="0.6" />
  <circle cx="256" cy="256" r="172" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />

  <!-- Water Droplet Silhouette -->
  <path d="M256 120 C256 120 160 250 160 310 C160 363 203 406 256 406 C309 406 352 363 352 310 C352 250 256 120 256 120 Z" 
        fill="url(#dropletGrad)" 
        filter="url(#glow)" />

  <!-- Inner Water Wave Highlight -->
  <path d="M190 320 C210 340 240 330 260 340 C280 350 300 340 320 330 C310 375 285 395 256 395 C215 395 185 365 190 320 Z" 
        fill="#0369a1" 
        opacity="0.5" />

  <!-- Bold Italic "W" Logo -->
  <text x="256" y="325" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="140" 
        font-weight="900" 
        font-style="italic"
        text-anchor="middle" 
        fill="#020617" 
        letter-spacing="-4">W</text>

  <!-- Small District Text Sub-Banner -->
  <rect x="146" y="375" width="220" height="28" rx="14" fill="#020617" stroke="#38bdf8" stroke-width="2" />
  <text x="256" y="394" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="12" 
        font-weight="800" 
        text-anchor="middle" 
        fill="#38bdf8" 
        letter-spacing="2">TAGOLOAN WDT</text>
</svg>
