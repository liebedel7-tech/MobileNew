<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tagoloan Water District - Meter Reader</title>
    <meta name="description" content="Official Field Meter Reading, Billing & Sync System for Tagoloan Water District" />
    
    <!-- Mobile & Android WebAPK Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WDT Reader" />
    <meta name="application-name" content="WDT Reader" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph for sharing -->
    <meta property="og:title" content="Tagoloan Water District - Meter Reader App" />
    <meta property="og:description" content="Official Field Meter Reading, Billing Calculation & Offline Synchronization System" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.svg" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Clean up any stale service workers to guarantee instant updates
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (let name of names) {
              caches.delete(name);
            }
          });
        }
      }
    </script>
  </body>
</html>
