<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tagoloan Water District Meter Reader</title>
    <meta name="description" content="Official mobile and field meter reading application for Tagoloan Water District with offline-first persistence, OCR meter recognition, tiered billing calculation, GPS verification, and server sync." />
    
    <!-- Mobile & Android WebAPK Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WDT Reader" />
    <meta name="application-name" content="WDT Reader" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph for sharing -->
    <meta property="og:title" content="Tagoloan Water District Meter Reader" />
    <meta property="og:description" content="Official mobile and field meter reading application for Tagoloan Water District with offline-first persistence, OCR meter recognition, tiered billing calculation, GPS verification, and server sync." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.svg" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker to enable PWA installability and offline caching
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('[TWD-PWA] Service worker registered successfully:', reg.scope);
          }).catch(function(err) {
            console.warn('[TWD-PWA] Service worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
